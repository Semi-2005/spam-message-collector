name: CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

# Aynı branch'e yeni push yapıldığında önceki gereksiz çalışan pipeline'ı iptal eder
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # 1. Backend Lint & Format Check (Fast Fail)
  # ============================================================
  backend-lint:
    name: 🐍 Python Lint & Format (Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff Linter
        run: ruff check .

      - name: Check Code Formatting
        run: ruff format --check .

  # ============================================================
  # 2. Backend Unit & API Integration Tests (Matrix Build)
  # ============================================================
  backend-test:
    name: 🧪 Python Tests (Py ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: [backend-lint]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Suite
        run: pytest -v --durations=10

  # ============================================================
  # 3. Frontend Static Analysis & Lint (Oxlint)
  # ============================================================
  frontend-lint:
    name: ⚛️ Frontend Lint (Oxlint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Oxlint
        working-directory: ./frontend
        run: npm run lint

  # ============================================================
  # 4. Frontend Production Build Check
  # ============================================================
  frontend-build:
    name: 📦 Frontend Build (Vite)
    runs-on: ubuntu-latest
    needs: [frontend-lint]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Vite Production Assets
        working-directory: ./frontend
        run: npm run build

  # ============================================================
  # 5. Pipeline Summary & Status Gate
  # ============================================================
  ci-status:
    name: ✅ CI All Checks Passed
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    if: always()
    steps:
      - name: Evaluate Pipeline Status
        run: |
          if [[ "${{ needs.backend-test.result }}" != "success" || "${{ needs.frontend-build.result }}" != "success" ]]; then
            echo "❌ Bazı test veya build aşamaları başarısız oldu!"
            exit 1
          fi
          echo "🎉 Tüm Backend ve Frontend kontrolleri başarıyla tamamlandı!"
